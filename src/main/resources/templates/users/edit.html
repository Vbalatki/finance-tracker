<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Редактирование профиля - Финансовый трекер</title>
    <div th:replace="~{layout/head :: head}"></div>
</head>
<body>
<div th:replace="~{layout/header :: header}"></div>

<div class="container mt-4">
    <div class="row justify-content-center">
        <div class="col-md-6">
            <nav aria-label="breadcrumb" class="mb-4">
                <ol class="breadcrumb">
                    <li class="breadcrumb-item"><a href="/profile">Профиль</a></li>
                    <li class="breadcrumb-item active">Редактирование</li>
                </ol>
            </nav>

            <div class="card">
                <div class="card-header">
                    <h4 class="mb-0"><i class="bi bi-pencil"></i> Редактирование профиля</h4>
                </div>
                <div class="card-body">
                    <form th:action="@{/profile/edit}" th:object="${userDto}" method="post">

                        <!-- Пароль не редактируется на этой форме (для этого отдельная страница
                             смены пароля), но UserDto.password валидируется как NotBlank+Size(8) —
                             прокидываем текущий (уже захэшированный) пароль скрытым полем, чтобы
                             валидация прошла. UserServiceImpl.updateUser() это поле не читает и
                             не перезаписывает пароль, так что переслать его безопасно с точки
                             зрения логики, но сам факт наличия хэша в разметке — компромисс,
                             а не идеальное решение; в идеале для редактирования профиля должен
                             быть отдельный dto без password. -->
                        <input type="hidden" th:field="*{password}">

                        <div class="mb-3">
                            <label for="name" class="form-label">Имя *</label>
                            <input type="text" class="form-control" id="name" th:field="*{name}"
                                   th:classappend="${#fields.hasErrors('name')} ? 'is-invalid' : ''" required>
                            <div th:if="${#fields.hasErrors('name')}" class="invalid-feedback">
                                <span th:errors="*{name}"></span>
                            </div>
                        </div>

                        <div class="mb-3">
                            <label for="surname" class="form-label">Фамилия *</label>
                            <input type="text" class="form-control" id="surname" th:field="*{surname}"
                                   th:classappend="${#fields.hasErrors('surname')} ? 'is-invalid' : ''" required>
                            <div th:if="${#fields.hasErrors('surname')}" class="invalid-feedback">
                                <span th:errors="*{surname}"></span>
                            </div>
                        </div>

                        <div class="mb-3">
                            <label for="birthday" class="form-label">Дата рождения *</label>
                            <input type="date" class="form-control" id="birthday" th:field="*{birthday}"
                                   th:classappend="${#fields.hasErrors('birthday')} ? 'is-invalid' : ''" required>
                            <div th:if="${#fields.hasErrors('birthday')}" class="invalid-feedback">
                                <span th:errors="*{birthday}"></span>
                            </div>
                        </div>

                        <div class="mb-3">
                            <label for="email" class="form-label">Email *</label>
                            <input type="email" class="form-control" id="email" th:field="*{email}"
                                   th:classappend="${#fields.hasErrors('email')} ? 'is-invalid' : ''" required>
                            <div th:if="${#fields.hasErrors('email')}" class="invalid-feedback">
                                <span th:errors="*{email}"></span>
                            </div>
                            <div class="form-text">Если email уже занят другим пользователем — увидишь ошибку здесь.</div>
                        </div>

                        <div class="d-flex justify-content-between">
                            <a href="/profile" class="btn btn-outline-secondary">
                                <i class="bi bi-x-circle"></i> Отмена
                            </a>
                            <button type="submit" class="btn btn-primary">
                                <i class="bi bi-check-circle"></i> Сохранить
                            </button>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>

<div th:replace="~{layout/footer :: footer}"></div>
</body>
</html>
