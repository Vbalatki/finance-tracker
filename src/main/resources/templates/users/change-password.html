<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Смена пароля - Финансовый трекер</title>
    <div th:replace="~{layout/head :: head}"></div>
</head>
<body>
<div th:replace="~{layout/header :: header}"></div>

<div class="container mt-4">
    <div class="row justify-content-center">
        <div class="col-md-6">
            <nav aria-label="breadcrumb" class="mb-4">
                <ol class="breadcrumb">
                    <li class="breadcrumb-item"><a href="/profile">Профиль</a></li>
                    <li class="breadcrumb-item active">Смена пароля</li>
                </ol>
            </nav>

            <div th:if="${error}" class="alert alert-danger alert-dismissible fade show" role="alert">
                <i class="bi bi-exclamation-triangle"></i> <span th:text="${error}"></span>
                <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
            </div>

            <div class="card">
                <div class="card-header">
                    <h4 class="mb-0"><i class="bi bi-key"></i> Смена пароля</h4>
                </div>
                <div class="card-body">
                    <form method="post" th:action="@{/profile/change-password}" th:object="${changePasswordDto}">
                        <div class="mb-3">
                            <label for="currentPassword" class="form-label">Текущий пароль *</label>
                            <input type="password" class="form-control" id="currentPassword"
                                   required
                                   th:classappend="${#fields.hasErrors('currentPassword')} ? 'is-invalid' : ''" th:field="*{currentPassword}">
                            <div class="invalid-feedback" th:if="${#fields.hasErrors('currentPassword')}">
                                <span th:errors="*{currentPassword}"></span>
                            </div>
                        </div>

                        <div class="mb-3">
                            <label for="newPassword" class="form-label">Новый пароль *</label>
                            <input type="password" class="form-control" id="newPassword"
                                   required
                                   th:classappend="${#fields.hasErrors('newPassword')} ? 'is-invalid' : ''" th:field="*{newPassword}">
                            <div class="form-text">Минимум 8 символов.</div>
                            <div class="invalid-feedback" th:if="${#fields.hasErrors('newPassword')}">
                                <span th:errors="*{newPassword}"></span>
                            </div>
                        </div>

                        <div class="mb-3">
                            <label for="confirmPassword" class="form-label">Подтверждение нового пароля *</label>
                            <input type="password" class="form-control" id="confirmPassword"
                                   required
                                   th:classappend="${#fields.hasErrors('confirmPassword')} ? 'is-invalid' : ''" th:field="*{confirmPassword}">
                            <div class="invalid-feedback" th:if="${#fields.hasErrors('confirmPassword')}">
                                <span th:errors="*{confirmPassword}"></span>
                            </div>
                        </div>

                        <div class="d-flex justify-content-between">
                            <a href="/profile" class="btn btn-outline-secondary">
                                <i class="bi bi-x-circle"></i> Отмена
                            </a>
                            <button type="submit" class="btn btn-primary">
                                <i class="bi bi-check-circle"></i> Сменить пароль
                            </button>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>

<div th:replace="~{layout/footer :: footer}"></div>
</body>
</html>
