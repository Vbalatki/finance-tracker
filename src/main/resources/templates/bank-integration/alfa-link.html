<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Привязка Альфа-Банка - Финансовый трекер</title>
    <div th:replace="~{layout/head :: head}"></div>
</head>
<body>
<div th:replace="~{layout/header :: header}"></div>

<div class="container mt-4">
    <div class="row justify-content-center">
        <div class="col-md-6">
            <div class="alert alert-danger" th:if="${error}">
                <span th:text="${error}"></span>
            </div>
            <div class="card">
                <div class="card-header">
                    <h5 class="mb-0"><i class="bi bi-bank"></i> Привязать счёт Альфа-Банка</h5>
                </div>
                <div class="card-body">
                    <p class="text-muted small">
                        Авторизация в Альфа-Банке уже пройдена. Укажите номер
                        счёта вручную — автоматический выбор из списка ваших
                        счетов Альфы пока не реализован.
                    </p>
                    <form method="post" th:action="@{/bank-integration/alfa/link}">
                        <div class="mb-3">
                            <label class="form-label">Номер счёта в Альфа-Банке</label>
                            <input class="form-control" name="externalAccountNumber" required type="text">
                        </div>
                        <div class="mb-3">
                            <label class="form-label">Название счёта в трекере</label>
                            <input class="form-control" name="accountName" placeholder="Например: Альфа расчётный"
                                   required type="text">
                        </div>
                        <div class="mb-3">
                            <label class="form-label">Валюта счёта</label>
                            <select class="form-select" name="currency" required>
                                <option th:each="currency : ${currencies}" th:text="${currency}" th:value="${currency}"></option>
                            </select>
                        </div>
                        <div class="d-flex justify-content-between">
                            <a class="btn btn-outline-secondary" href="/accounts">Отмена</a>
                            <button class="btn btn-primary" type="submit">Привязать</button>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>
<div th:replace="~{layout/footer :: footer}"></div>
</body>
</html>
