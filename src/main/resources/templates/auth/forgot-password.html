<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
  <title>Восстановление пароля - Финансовый трекер</title>
  <div th:replace="~{layout/head :: head}"></div>
</head>
<body class="bg-light">

<div class="container">
  <div class="row justify-content-center align-items-center" style="min-height: 100vh;">
    <div class="col-md-5 col-lg-4">
      <div class="text-center mb-4">
        <i class="bi bi-key display-4 text-primary"></i>
        <h1 class="h3 mt-2 mb-0">Восстановление пароля</h1>
        <p class="text-muted">Укажите email — пришлём ссылку для сброса</p>
      </div>

      <div class="card shadow-sm">
        <div class="card-body p-4">
          <div class="alert alert-success d-flex align-items-center" role="alert" th:if="${success}">
            <i class="bi bi-check-circle me-2"></i>
            <span th:text="${success}"></span>
          </div>
          <div class="alert alert-danger d-flex align-items-center" role="alert" th:if="${error}">
            <i class="bi bi-exclamation-triangle me-2"></i>
            <span th:text="${error}"></span>
          </div>

          <form method="post" th:action="@{/forgot-password}" th:unless="${success}">
            <div class="mb-4">
              <label class="form-label" for="email">Email</label>
              <div class="input-group">
                <span class="input-group-text"><i class="bi bi-envelope"></i></span>
                <input autofocus class="form-control" id="email" name="email"
                       placeholder="you@example.com" required type="email">
              </div>
            </div>
            <button class="btn btn-primary w-100 py-2" type="submit">
              <i class="bi bi-send"></i> Отправить ссылку
            </button>
          </form>
        </div>
      </div>

      <p class="text-center text-muted mt-3 mb-0">
        <a th:href="@{/login}">Вернуться к входу</a>
      </p>
    </div>
  </div>
</div>
</body>
</html>
