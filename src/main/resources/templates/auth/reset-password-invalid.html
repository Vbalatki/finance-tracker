<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Ссылка недействительна - Финансовый трекер</title>
    <div th:replace="~{layout/head :: head}"></div>
</head>
<body class="bg-light">

<div class="container">
    <div class="row justify-content-center align-items-center" style="min-height: 100vh;">
        <div class="col-md-5 col-lg-4 text-center">
            <i class="bi bi-x-circle display-1 text-danger"></i>
            <h1 class="h3 mt-3">Ссылка недействительна</h1>
            <p class="text-muted" th:text="${error}"></p>
            <a class="btn btn-primary mt-2" th:href="@{/forgot-password}">Запросить новую ссылку</a>
        </div>
    </div>
</div>
</body>
</html>
