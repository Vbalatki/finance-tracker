<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Новый пароль - Финансовый трекер</title>
    <div th:replace="~{layout/head :: head}"></div>
</head>
<body class="bg-light">

<div class="container">
    <div class="row justify-content-center align-items-center" style="min-height: 100vh;">
        <div class="col-md-5 col-lg-4">
            <div class="text-center mb-4">
                <i class="bi bi-shield-lock display-4 text-primary"></i>
                <h1 class="h3 mt-2 mb-0">Новый пароль</h1>
            </div>

            <div class="card shadow-sm">
                <div class="card-body p-4">
                    <div class="alert alert-danger d-flex align-items-center" role="alert" th:if="${error}">
                        <i class="bi bi-exclamation-triangle me-2"></i>
                        <span th:text="${error}"></span>
                    </div>

                    <form method="post" th:action="@{/reset-password(token=${token})}" th:object="${resetPasswordDto}">
                        <div class="mb-3">
                            <label class="form-label" for="newPassword">Новый пароль *</label>
                            <input class="form-control" id="newPassword" required
                                   th:classappend="${#fields.hasErrors('newPassword')} ? 'is-invalid' : ''"
                                   th:field="*{newPassword}" type="password">
                            <div class="invalid-feedback" th:if="${#fields.hasErrors('newPassword')}">
                                <span th:errors="*{newPassword}"></span>
                            </div>
                        </div>
                        <div class="mb-4">
                            <label class="form-label" for="confirmPassword">Подтверждение пароля *</label>
                            <input class="form-control" id="confirmPassword" required
                                   th:classappend="${#fields.hasErrors('confirmPassword')} ? 'is-invalid' : ''"
                                   th:field="*{confirmPassword}" type="password">
                            <div class="invalid-feedback" th:if="${#fields.hasErrors('confirmPassword')}">
                                <span th:errors="*{confirmPassword}"></span>
                            </div>
                        </div>
                        <button class="btn btn-primary w-100 py-2" type="submit">
                            <i class="bi bi-check-circle"></i> Установить новый пароль
                        </button>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>
</body>
</html>
