<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>

</head>
<body>
<div th:fragment="header">
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
        <div class="container">
            <a class="navbar-brand" href="/">Финансовый трекер</a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav ms-auto">
                    <li class="nav-item">
                        <a class="nav-link" href="/dashboard">
                            <i class="bi bi-speedometer2"></i> <span th:text="#{nav.dashboard}">Дашборд</span>
                        </a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="/transactions">
                            <i class="bi bi-arrow-left-right"></i> <span th:text="#{nav.transactions}">Транзакции</span>
                        </a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="/accounts">
                            <i class="bi bi-wallet2"></i> <span th:text="#{nav.accounts}">Счета</span>
                        </a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="/categories">
                            <i class="bi bi-tags"></i> <span th:text="#{nav.categories}">Категории</span>
                        </a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="/budgets">
                            <i class="bi bi-pie-chart"></i> <span th:text="#{nav.budgets}">Бюджеты</span>
                        </a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="/calendar">
                            <i class="bi bi-calendar3"></i> <span th:text="#{nav.calendar}">Календарь</span>
                        </a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="/recurring">
                            <i class="bi bi-arrow-repeat"></i> <span th:text="#{nav.recurring}">Плановые списания</span>
                        </a>
                    </li>

                    <li class="nav-item" sec:authorize="hasRole('ADMIN')">
                        <a class="nav-link text-warning" href="/admin">
                            <i class="bi bi-shield-lock-fill"></i> <span th:text="#{nav.admin}">Админ панель</span>
                        </a>
                    </li>

                    <li class="nav-item dropdown" th:with="auth=${#authentication}">
                        <a class="nav-link dropdown-toggle" href="#" id="userDropdown" role="button" data-bs-toggle="dropdown"
                           th:if="${auth != null and auth.authenticated}">
                            <i class="bi bi-person-circle"></i> <span th:text="${auth.name}"></span>
                        </a>
                        <ul class="dropdown-menu dropdown-menu-end" th:if="${auth != null and auth.authenticated}">
                            <li><a class="dropdown-item" href="/profile"><i class="bi bi-person"></i> <span th:text="#{nav.profile}">Профиль</span></a></li>
                            <li><a class="dropdown-item" href="/settings"><i class="bi bi-gear"></i> <span th:text="#{nav.settings}">Настройки</span></a></li>
                            <li><hr class="dropdown-divider"></li>
                            <li>
                                <form th:action="@{/logout}" method="post" class="d-inline">
                                    <button type="submit" class="dropdown-item">
                                        <i class="bi bi-box-arrow-right"></i> <span th:text="#{nav.logout}">Выход</span>
                                    </button>
                                </form>
                            </li>
                        </ul>
                    </li>
                </ul>
            </div>
        </div>
    </nav>

    <!-- JavaScript для активации текущего пункта меню -->
    <script>
        document.addEventListener('DOMContentLoaded', function() {
            const currentPath = window.location.pathname;
            let activeId = '';

            if (currentPath.includes('/dashboard')) {
                activeId = 'nav-dashboard';
            } else if (currentPath.includes('/accounts')) {
                activeId = 'nav-accounts';
            } else if (currentPath.includes('/transactions')) {
                activeId = 'nav-transactions';
            } else if (currentPath.includes('/budgets')) {
                activeId = 'nav-budgets';
            } else if (currentPath.includes('/categories')) {
                activeId = 'nav-categories';
            }

            if (activeId) {
                const activeElement = document.getElementById(activeId);
                if (activeElement) {
                    activeElement.classList.add('active');
                }
            }
        });
    </script>
</div>
</body>
</html>
