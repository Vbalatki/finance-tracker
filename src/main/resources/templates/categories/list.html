<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Категории</title>
    <div th:replace="~{layout/head :: head}"></div>
</head>
<body>
<div th:replace="~{layout/header :: header}"></div>

<div class="container mt-4">
    <div class="d-flex justify-content-between align-items-center mb-4">
        <h1>Категории</h1>
        <a href="/categories/create" class="btn btn-primary">
            <i class="bi bi-plus-circle"></i> Новая категория
        </a>
    </div>

    <div th:if="${success != null}" class="alert alert-success" role="alert">
        <span th:text="${success}"></span>
    </div>
    <div th:if="${error != null}" class="alert alert-danger" role="alert">
        <span th:text="${error}"></span>
    </div>

    <!-- Стандартные категории -->
    <div class="card mb-4">
        <div class="card-header bg-light">
            <h5 class="mb-0"><i class="bi bi-shield-check text-muted"></i> Стандартные категории</h5>
            <p class="text-muted small mb-0 mt-1">Доступны всем, их нельзя изменить или удалить</p>
        </div>
        <div class="card-body">
            <div class="d-flex flex-wrap gap-2">
                <span th:each="category : ${categories}"
                      th:if="${category.defaultCategory}"
                      class="badge bg-light text-dark border px-3 py-2"
                      th:text="${category.name}">
                    Категория
                </span>
            </div>
            <p th:if="${#lists.isEmpty(categories.?[defaultCategory])}" class="text-muted mb-0">
                Стандартных категорий нет
            </p>
        </div>
    </div>

    <!-- Мои категории -->
    <div class="card">
        <div class="card-header">
            <h5 class="mb-0"><i class="bi bi-person"></i> Мои категории</h5>
        </div>
        <div class="table-responsive">
            <table class="table table-striped mb-0">
                <thead>
                <tr>
                    <th>Название</th>
                    <th>Транзакций</th>
                    <th>Действия</th>
                </tr>
                </thead>
                <tbody>
                <tr th:each="category : ${categories}" th:if="${!category.defaultCategory}">
                    <td th:text="${category.name}">Категория</td>
                    <td th:text="${category.transactionsCount}">0</td>
                    <td>
                        <a th:href="@{/categories/{id}/edit(id=${category.id})}" class="btn btn-sm btn-warning">
                            <i class="bi bi-pencil"></i>
                        </a>
                        <form th:action="@{/categories/{id}/delete(id=${category.id})}" method="post"
                              style="display:inline;" onsubmit="return confirm('Удалить категорию?')">
                            <button type="submit" class="btn btn-sm btn-danger">
                                <i class="bi bi-trash"></i>
                            </button>
                        </form>
                    </td>
                </tr>
                </tbody>
            </table>
            <p th:if="${#lists.isEmpty(categories.?[!defaultCategory])}" class="text-muted text-center py-4 mb-0">
                Своих категорий нет. Создайте первую!
            </p>
        </div>
    </div>
</div>

<div th:replace="~{layout/footer :: footer}"></div>
</body>
</html>
