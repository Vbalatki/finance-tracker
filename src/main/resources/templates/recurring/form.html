<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Новое плановое списание</title>
    <div th:replace="~{layout/head :: head}"></div>
</head>
<body>
<div th:replace="~{layout/header :: header}"></div>

<div class="container mt-4">
    <div class="row justify-content-center">
        <div class="col-md-6">
            <div class="card">
                <div class="card-header">
                    <h4>Новое плановое списание</h4>
                </div>
                <div class="card-body">
                    <form method="post" th:action="@{/recurring}" th:object="${commitmentDto}">
                        <div class="mb-3">
                            <label class="form-label">Название</label>
                            <input type="text" class="form-control" th:field="*{name}"
                                   placeholder="Например: Netflix, Аренда квартиры" required>
                            <div th:errors="*{name}" class="text-danger small"></div>
                        </div>

                        <div class="row">
                            <div class="col-md-6 mb-3">
                                <label class="form-label">Сумма</label>
                                <input type="number" step="0.01" class="form-control" th:field="*{amount}" required>
                                <div th:errors="*{amount}" class="text-danger small"></div>
                            </div>
                            <div class="col-md-6 mb-3">
                                <label class="form-label">Тип</label>
                                <select class="form-select" th:field="*{type}" required>
                                    <option th:each="t : ${types}" th:value="${t}"
                                            th:text="${t.name() == 'INCOME'} ? 'Поступление' : 'Списание'"></option>
                                </select>
                            </div>
                        </div>

                        <div class="mb-3">
                            <label class="form-label">День месяца</label>
                            <input type="number" min="1" max="31" class="form-control" th:field="*{dayOfMonth}" required>
                            <div class="form-text">Для месяцев короче — берётся последний день месяца</div>
                            <div th:errors="*{dayOfMonth}" class="text-danger small"></div>
                        </div>

                        <div class="mb-3">
                            <label class="form-label">Категория (необязательно)</label>
                            <select class="form-select" id="categoryId" th:field="*{categoryId}">
                                <option value="">Без категории</option>
                                <option th:each="cat : ${categories}" th:value="${cat.id}" th:text="${cat.name}"></option>
                            </select>
                        </div>

                        <div class="mb-4">
                            <label class="form-label">Счёт (необязательно)</label>
                            <select class="form-select" th:field="*{accountId}">
                                <option value="">Не привязан к конкретному счёту</option>
                                <option th:each="acc : ${accounts}" th:value="${acc.id}" th:text="${acc.name}"></option>
                            </select>
                        </div>

                        <div class="d-flex justify-content-between">
                            <a class="btn btn-secondary" th:href="@{/recurring}">Отмена</a>
                            <button type="submit" class="btn btn-primary">Сохранить</button>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>

<div th:replace="~{layout/footer :: footer}"></div>

<script>
    document.addEventListener('DOMContentLoaded', function () {
        const categorySelect = document.getElementById('categoryId');
        if (categorySelect && typeof Choices !== 'undefined') {
            new Choices(categorySelect, { searchEnabled: true, itemSelectText: '', shouldSort: false });
        }
    });
</script>
</body>
</html>
