<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Календарь трат - Финансовый трекер</title>
    <div th:replace="~{layout/head :: head}"></div>
    <style>
        .calendar-grid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 4px; }
        .calendar-weekday { text-align: center; font-weight: 600; font-size: 0.85rem; color: #6c757d; padding-bottom: 4px; }
        .calendar-day { min-height: 90px; border-radius: 6px; border: 1px solid #e9ecef; padding: 6px; }
        .calendar-day.other-month { opacity: 0.35; }
        .calendar-day.today { border: 2px solid #0d6efd; }
        .calendar-day-number { font-weight: 600; font-size: 0.9rem; }
        .calendar-day-expense { font-size: 0.75rem; color: #dc3545; font-weight: 600; }
        .calendar-day-income { font-size: 0.75rem; color: #198754; }
        .calendar-day-planned { font-size: 0.7rem; color: #6c757d; border-top: 1px dashed #ced4da; margin-top: 4px; padding-top: 2px; }
    </style>
</head>
<body>
<div th:replace="~{layout/header :: header}"></div>

<div class="container mt-4">
    <div class="d-flex justify-content-between align-items-center mb-4">
        <h1><i class="bi bi-calendar3"></i> Календарь трат</h1>
        <a th:href="@{/recurring}" class="btn btn-outline-primary btn-sm">
            <i class="bi bi-arrow-repeat"></i> Плановые списания
        </a>
    </div>

    <div class="d-flex justify-content-between align-items-center mb-3">
        <a th:href="@{/calendar(year=${prevMonth.year}, month=${prevMonth.monthValue})}" class="btn btn-outline-secondary">
            <i class="bi bi-chevron-left"></i>
        </a>
        <h4 class="mb-0" th:text="${#temporals.format(calendarMonth.month.atDay(1), 'LLLL yyyy')}">Месяц</h4>
        <a th:href="@{/calendar(year=${nextMonth.year}, month=${nextMonth.monthValue})}" class="btn btn-outline-secondary">
            <i class="bi bi-chevron-right"></i>
        </a>
    </div>

    <div class="row mb-3">
        <div class="col-md-6">
            <div class="card border-0 bg-danger bg-opacity-10">
                <div class="card-body text-center py-2">
                    <small class="text-muted">Расходы за месяц</small>
                    <h5 class="mb-0 text-danger"
                        th:text="${#numbers.formatDecimal(calendarMonth.totalExpense, 1, 'COMMA', 2, 'POINT') + ' ₽'}">0 ₽</h5>
                </div>
            </div>
        </div>
        <div class="col-md-6">
            <div class="card border-0 bg-success bg-opacity-10">
                <div class="card-body text-center py-2">
                    <small class="text-muted">Поступления за месяц</small>
                    <h5 class="mb-0 text-success"
                        th:text="${#numbers.formatDecimal(calendarMonth.totalIncome, 1, 'COMMA', 2, 'POINT') + ' ₽'}">0 ₽</h5>
                </div>
            </div>
        </div>
    </div>

    <div class="card">
        <div class="card-body">
            <div class="calendar-grid mb-2">
                <div class="calendar-weekday">Пн</div>
                <div class="calendar-weekday">Вт</div>
                <div class="calendar-weekday">Ср</div>
                <div class="calendar-weekday">Чт</div>
                <div class="calendar-weekday">Пт</div>
                <div class="calendar-weekday">Сб</div>
                <div class="calendar-weekday">Вс</div>
            </div>
            <div class="calendar-grid">
                <div th:each="day : ${calendarMonth.days}"
                     class="calendar-day"
                     th:classappend="${(day.currentMonth ? '' : 'other-month') + (day.today ? ' today' : '')}"
                     th:style="${(day.currentMonth and !day.future and day.intensity > 0) ? 'background-color: rgba(220,53,69,' + (0.15 + day.intensity * 0.55) + ');' : ''}">
                    <div class="calendar-day-number" th:text="${day.date.dayOfMonth}">1</div>
                    <div th:if="${day.totalExpense > 0}" class="calendar-day-expense"
                         th:text="'-' + ${#numbers.formatDecimal(day.totalExpense, 1, 'COMMA', 0, 'POINT')} + ' ₽'"></div>
                    <div th:if="${day.totalIncome > 0}" class="calendar-day-income"
                         th:text="'+' + ${#numbers.formatDecimal(day.totalIncome, 1, 'COMMA', 0, 'POINT')} + ' ₽'"></div>
                    <div th:each="charge : ${day.plannedCharges}" class="calendar-day-planned">
                        <span th:text="${charge.name}"></span>:
                        <span th:text="${(charge.type.name() == 'EXPENSE' ? '-' : '+') + #numbers.formatDecimal(charge.amount, 1, 'COMMA', 0, 'POINT')}"></span>
                    </div>
                </div>
            </div>
        </div>
        <div class="card-footer text-muted small">
            <i class="bi bi-square-fill" style="color: rgba(220,53,69,0.5);"></i>
            Чем темнее заливка — тем больше потрачено в этот день. Пунктиром — плановые списания на будущие дни.
        </div>
    </div>
</div>

<div th:replace="~{layout/footer :: footer}"></div>
</body>
</html>
