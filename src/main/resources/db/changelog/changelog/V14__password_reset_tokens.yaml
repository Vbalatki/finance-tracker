databaseChangeLog:
  - changeSet:
      id: 32
      author: dmitriy-sidorov
      comment: >
        Токены сброса пароля. Одноразовые (used) и временные (expires_at) —
        оба условия проверяет PasswordResetServiceImpl перед сменой пароля.
      changes:
        - createTable:
            schemaName: finance_tracker
            tableName: password_reset_tokens
            columns:
              - column:
                  name: id
                  type: BIGINT
                  autoIncrement: true
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: token
                  type: VARCHAR(64)
                  constraints:
                    nullable: false
                    unique: true
              - column:
                  name: user_id
                  type: BIGINT
                  constraints:
                    nullable: false
              - column:
                  name: expires_at
                  type: TIMESTAMP
                  constraints:
                    nullable: false
              - column:
                  name: used
                  type: BOOLEAN
                  defaultValueBoolean: false
                  constraints:
                    nullable: false
              - column:
                  name: created_at
                  type: TIMESTAMP
                  defaultValueComputed: CURRENT_TIMESTAMP

        - addForeignKeyConstraint:
            baseTableSchemaName: finance_tracker
            baseTableName: password_reset_tokens
            baseColumnNames: user_id
            referencedTableSchemaName: finance_tracker
            referencedTableName: users
            referencedColumnNames: id
            constraintName: fk_password_reset_tokens_user
            onDelete: CASCADE
            onUpdate: CASCADE

        - createIndex:
            schemaName: finance_tracker
            tableName: password_reset_tokens
            indexName: idx_password_reset_tokens_token
            columns:
              - column:
                  name: token