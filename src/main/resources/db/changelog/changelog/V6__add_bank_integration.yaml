databaseChangeLog:
  - changeSet:
      id: 20
      author: dmitriy-sidorov
      comment: >
        Добавляет привязку счёта к внешнему банковскому счёту напрямую
        в accounts — bank_code/external_account_number NULL для счетов,
        созданных вручную.
      changes:
        - addColumn:
            schemaName: finance_tracker
            tableName: accounts
            columns:
              - column:
                  name: bank_code
                  type: VARCHAR(32)
              - column:
                  name: external_account_number
                  type: VARCHAR(64)
              - column:
                  name: last_synced_at
                  type: TIMESTAMP

        - addUniqueConstraint:
            schemaName: finance_tracker
            tableName: accounts
            columnNames: bank_code, external_account_number
            constraintName: uk_accounts_bank_external_account

  - changeSet:
      id: 21
      author: dmitriy-sidorov
      comment: >
        Добавляет external_source/external_id в transactions для
        дедупликации при повторном импорте банковских операций.
      changes:
        - addColumn:
            schemaName: finance_tracker
            tableName: transactions
            columns:
              - column:
                  name: external_source
                  type: VARCHAR(32)
              - column:
                  name: external_id
                  type: VARCHAR(128)

        - addUniqueConstraint:
            schemaName: finance_tracker
            tableName: transactions
            columnNames: external_source, external_id
            constraintName: uk_transactions_external_source_id