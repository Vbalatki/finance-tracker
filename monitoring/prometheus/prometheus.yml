global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: 'finance_tracker_app'
    metrics_path: '/actuator/prometheus'
    scrape_interval: 5s
    static_configs:
      - targets: ['app:9091']
        labels:
          application: 'finance-tracker'

  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']